version: 2
project_name: ga4-pp-cli
changelog:
  disable: true
builds:
  - id: ga4-pp-cli
    main: ./cmd/ga4-pp-cli
    binary: ga4-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X ga4-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ga4-pp-mcp
    main: ./cmd/ga4-pp-mcp
    binary: ga4-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ga4-pp-cli
    repository:
      owner: spindle79
      name: homebrew-tap
    homepage: "https://github.com/spindle79/ga4-pp-cli"
    description: "Every GA4 Data API endpoint, plus saved report profiles, drift detection, schema search, and quality guards no other..."
    install: |
      bin.install "ga4-pp-cli"
      bin.install "ga4-pp-mcp"
